# Lint + tests on the same platform the project is verified on (macOS arm64, Python 3.13, CPU only).
# fast: every push / PR, no downloads; tests that need detector weights or clips are skipped and the skip count is
#       printed. full: also fetches the pinned YOLOX weights and the OpenCV sample clip (both sha256-checked) and
#       runs the slow pycolmap tests.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format github .
      - name: Tests (not slow)
        run: python -m pytest -m "not slow" -rs -p no:cacheprovider --junitxml=pytest-fast.xml 2>&1 | tee pytest-fast.log; exit "${PIPESTATUS[0]}"
      - name: Skip count
        if: always()
        run: test -f pytest-fast.xml && python scripts/ci_summary.py pytest-fast.xml >> "$GITHUB_STEP_SUMMARY" || echo "tests did not run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-fast
          path: pytest-fast.*

  full:
    runs-on: macos-15
    timeout-minutes: 40
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            data/models/yolox
            data/public/opencv_vtest/vtest.avi
          key: test-assets-v1
      - name: Fetch weights and clip (sha256-checked)
        run: |
          scripts/fetch_models.sh yolox_nano
          f=data/public/opencv_vtest/vtest.avi
          want=45cddc9490be69345cbdab64ca583be65987e864ca408038e648db99e10516cf
          if [[ ! -f $f || "$(shasum -a 256 $f | cut -d' ' -f1)" != $want ]]; then
            curl -fL --retry 2 -o $f.part https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/vtest.avi
            [[ "$(shasum -a 256 $f.part | cut -d' ' -f1)" == $want ]] || { echo "vtest.avi sha256 mismatch"; exit 1; }
            mv $f.part $f
          fi
      - name: Tests (all)
        run: python -m pytest -rs -p no:cacheprovider --junitxml=pytest-full.xml 2>&1 | tee pytest-full.log; exit "${PIPESTATUS[0]}"
      - name: Skip count
        if: always()
        run: test -f pytest-full.xml && python scripts/ci_summary.py pytest-full.xml >> "$GITHUB_STEP_SUMMARY" || echo "tests did not run" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-full
          path: pytest-full.*
